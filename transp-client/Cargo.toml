[package]
name = "transp-client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
async-wsocket = "0.14.0"
bytes = { version = "1.11.1", features = ["extra-platforms", "serde"] }
console_error_panic_hook = "0.1.7"
futures-util = { version = "0.3.32", features = ["sink", "std"] }
getrandom = { version = "0.4.2", features = ["std", "wasm_js"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
transp-common = { version = "0.1.0", path = "../transp-common", features = ["wasm"] }
url = { version = "2.5.8", features = ["serde"] }
wasm-bindgen = { version = "0.2.122", features = ["serde", "serde-serialize"] }
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.99", features = ["console"] }


[build-dependencies]
#slint-build = "1.16.1"
