[package]
name = "transp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws", "http2"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
futures-util = { version = "0.3.32", features = ["sink", "std"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.1"
serde = "1.0.228"
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["url"] }
tower-http = { version = "0.6.9", features = ["fs", "mime_guess", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
transp-common = { version = "0.1.0", path = "../transp-common", features = ["desktop"] }


