[package]
name = "transp-common"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:ewebsock"]
desktop = ["dep:axum"]

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"], optional = true }
postcard = { version = "1.1.3", features = ["use-std", "postcard-derive"] }
serde = { version = "1.0.228", features = ["derive"] }
ewebsock = {version = "0.8.0", optional = true}
#tokio-tungstenite-wasm = {version = "0.8.2", optional = true}
wasm-bindgen = { version = "0.2.122", features = ["serde", "serde-serialize"], optional = true }

