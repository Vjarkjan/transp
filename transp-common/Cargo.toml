[package]
name = "transp-common"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
postcard = { version = "1.1.3", features = ["use-std", "postcard-derive"] }
serde = { version = "1.0.228", features = ["derive"] }

